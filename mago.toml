php-version = "8.4"

[source]
paths = ["app", "bootstrap/app.php", "config", "database", "routes", "tests"]
includes = ["vendor"]

[formatter]
preset = "laravel"
space-after-cast-unary-prefix-operators = false
line-before-binary-operator = false
indent-heredoc = false

[linter]
integrations = ["laravel", "pest"]
excludes = ["config", "database/migrations"]

[linter.rules]
no-shorthand-ternary = { enabled = false }
readable-literal = { enabled = false }
tagged-todo = { enabled = false }
# Data classes (app/Data) carry a card's worth of fields in their constructor.
excessive-parameter-list = { constructor-threshold = 16 }
no-literal-password = { exclude = ["tests"] }
# Test helpers take literals all day (`social_user('903', 'grace@example.com')`); naming each one hides the point of the test.
literal-named-argument = { exclude = ["tests"] }

[analyzer]
excludes = ["config", "database/migrations", "tests"]
ignore = ["invalid-type-cast"]

