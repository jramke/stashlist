# Redis configuration for Stashlist.
# The ddev-generated marker is removed on purpose so `ddev add-on get` keeps this file.
#
# Queues share this instance with cache and sessions, so nothing may be evicted:
# a full Redis must fail loudly, not delete jobs (same policy as production, plan 7.1).

maxmemory 512mb
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
