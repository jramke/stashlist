name: tests

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        services:
            mariadb:
                image: mariadb:11.8
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: stashlist_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

            meilisearch:
                image: getmeili/meilisearch:v1.54
                env:
                    MEILI_ENV: development
                    MEILI_MASTER_KEY: ci-meilisearch-master-key
                    MEILI_NO_ANALYTICS: 'true'
                ports:
                    - 7700:7700
                options: >-
                    --health-cmd="curl -fs http://localhost:7700/health"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        # Process variables win over .env, so `composer setup` and the tests both use the service.
        env:
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: stashlist_test
            DB_USERNAME: root
            DB_PASSWORD: root
            MEILISEARCH_HOST: http://127.0.0.1:7700
            MEILISEARCH_KEY: ci-meilisearch-master-key
            # The search tests skip without a server; in CI a missing server has to fail the run.
            MEILISEARCH_REQUIRED: '1'

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  extensions: imagick, intl, redis
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'

            - name: Setup Application
              run: composer setup

            - name: Run Checks
              run: composer test

            - name: Check the JavaScript budget of the feed
              run: npm run check:bundle

    e2e:
        runs-on: ubuntu-latest

        services:
            mariadb:
                image: mariadb:11.8
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: stashlist_e2e
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

            meilisearch:
                image: getmeili/meilisearch:v1.54
                env:
                    MEILI_ENV: development
                    MEILI_MASTER_KEY: ci-meilisearch-master-key
                    MEILI_NO_ANALYTICS: 'true'
                ports:
                    - 7700:7700
                options: >-
                    --health-cmd="curl -fs http://localhost:7700/health"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        # A real server, a real database and a real search engine; the queue runs inside the request, so a
        # saved stash is indexed before the page answers.
        env:
            APP_ENV: local
            APP_URL: http://127.0.0.1:8000
            E2E_BASE_URL: http://127.0.0.1:8000
            E2E_QUEUE: sync
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: stashlist_e2e
            DB_USERNAME: root
            DB_PASSWORD: root
            QUEUE_CONNECTION: sync
            SESSION_DRIVER: file
            CACHE_STORE: file
            MEILISEARCH_HOST: http://127.0.0.1:7700
            MEILISEARCH_KEY: ci-meilisearch-master-key
            INERTIA_SSR_ENABLED: 'false'
            PULSE_ENABLED: 'false'
            PHP_CLI_SERVER_WORKERS: 4

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  extensions: imagick, intl, redis
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'

            - name: Setup Application
              run: composer setup

            - name: Install the browser
              run: npx playwright install --with-deps chromium

            - name: Start the application
              run: |
                  php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
                  curl --retry 20 --retry-delay 1 --retry-connrefused --silent --output /dev/null http://127.0.0.1:8000/login

            - name: Run the browser flows
              run: npm run e2e

            # The public pages are server-rendered by the SSR process and have to stay fast and readable: a
            # second copy of the app with SSR on, measured by Lighthouse (the budget is in lighthouserc.json).
            - name: Start the application with server-side rendering
              run: |
                  php artisan inertia:start-ssr > ssr.log 2>&1 &
                  INERTIA_SSR_ENABLED=true php artisan serve --host=127.0.0.1 --port=8001 > serve-ssr.log 2>&1 &
                  curl --retry 20 --retry-delay 1 --retry-connrefused --silent --output /dev/null http://127.0.0.1:8001/pricing

            - name: Measure the public pages
              run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

    extension:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: extension

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'

            - name: Install
              run: npm ci

            - name: Generate the WXT types
              run: npx wxt prepare

            - name: Check types
              run: npm run check

            - name: Run the unit tests
              run: npm test

            - name: Build for Chrome and Firefox
              run: |
                  npm run build
                  npm run build:firefox

            - name: Check the permissions in the manifests
              run: npm run check:manifest

    image:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The image that self-hosters run: it has to build, and compose has to accept its own file.
            - name: Build the image
              run: docker build --tag stashlist:ci .

            - name: Check the compose file
              run: |
                  cp .env.docker.example .env
                  printf 'DB_PASSWORD=x\nDB_ROOT_PASSWORD=x\nMEILISEARCH_MASTER_KEY=x\nAPP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\n' >> .env
                  docker compose config --quiet
