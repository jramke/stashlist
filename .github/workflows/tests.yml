name: tests

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        services:
            mariadb:
                image: mariadb:11.8
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: stashlist_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

            meilisearch:
                image: getmeili/meilisearch:v1.54
                env:
                    MEILI_ENV: development
                    MEILI_MASTER_KEY: ci-meilisearch-master-key
                    MEILI_NO_ANALYTICS: 'true'
                ports:
                    - 7700:7700
                options: >-
                    --health-cmd="curl -fs http://localhost:7700/health"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        # Process variables win over .env, so `composer setup` and the tests both use the service.
        env:
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: stashlist_test
            DB_USERNAME: root
            DB_PASSWORD: root
            MEILISEARCH_HOST: http://127.0.0.1:7700
            MEILISEARCH_KEY: ci-meilisearch-master-key
            # The search tests skip without a server; in CI a missing server has to fail the run.
            MEILISEARCH_REQUIRED: '1'

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  extensions: imagick, intl, redis
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'

            - name: Setup Application
              run: composer setup

            - name: Run Checks
              run: composer test
